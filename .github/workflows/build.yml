name: Build Neko Kernel (alioth)

on:
  push:
    branches: [aosp-16]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with KernelSU submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Init submodules
        run: |
          git submodule update --init --recursive
          test -f KernelSU-Next/kernel/Kconfig

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: neko-kernel-alioth
          max-size: 2G

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            python3 python-is-python3 perl cpio lzop zip zstd

      - name: Fetch Neutron Clang
        run: |
          set -o pipefail
          mkdir -p "$HOME/clang"
          url="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst"
          echo "Clang URL: $url"
          curl -fSL "$url" -o /tmp/clang.tar.zst
          tar -I zstd -xf /tmp/clang.tar.zst -C "$HOME/clang"
          clang_bin=$(dirname "$(find "$HOME/clang" -path '*/bin/clang' | head -1)")
          [ -x "$clang_bin/clang" ] && [ -e "$clang_bin/ld.lld" ] || {
            echo "clang/ld.lld not found under $HOME/clang:"; ls -lR "$HOME/clang/bin" || true; exit 1;
          }
          echo "$clang_bin" >> "$GITHUB_PATH"
          "$clang_bin/clang" --version | head -1

      - name: Build
        run: |
          make O=out ARCH=arm64 LLVM=1 CC="ccache clang" alioth_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 CC="ccache clang" Image.gz dtbs
          # second pass needed: Image.gz-dtb/dtbo.img pick up dtbs/dtbo via
          # parse-time $(shell find), which is empty on a fresh out/
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 CC="ccache clang" Image.gz-dtb dtbo.img
          test -f out/arch/arm64/boot/Image.gz-dtb
          test -f out/arch/arm64/boot/dtbo.img

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cat > AnyKernel3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          properties() { '
          kernel.string=Neko by Neko-CIO
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=alioth
          device.name2=aliothin
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          # alioth is A/B: auto-detect slot, there is no unsuffixed boot/dtbo partition
          block=auto;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          ## end boot install
          EOF
          cp out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Neko-alioth-r${GITHUB_RUN_NUMBER}.zip . -x ".git*" -x "README.md"
          cd ..
          sha256sum Neko-alioth-r${GITHUB_RUN_NUMBER}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neko-alioth-r${{ github.run_number }}
          path: Neko-alioth-r${{ github.run_number }}.zip
          if-no-files-found: error
